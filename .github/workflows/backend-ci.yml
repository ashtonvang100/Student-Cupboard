name: Backend CI

on:
  push:
    branches: "**"
    paths:
        - "backend/**"
        - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: main
    paths:
        - "backend/**"
        - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cupboard_test
          POSTGRES_PASSWORD: test_only_password
          POSTGRES_DB: student_cupboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cupboard_test -d student_cupboard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://cupboard_test:test_only_password@127.0.0.1:5432/student_cupboard_test
      REQUIRE_TEST_DATABASE: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build backend
        run: npm run build
